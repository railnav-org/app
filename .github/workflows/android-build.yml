name: Android Release Build

# This pipeline only runs when you push a version tag (e.g., v1.0, v2.1.3)
on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build, Sign, and Release
    runs-on: ubuntu-latest
    # Required permission to allow the bot to create a GitHub Release
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug and Release APKs
        run: ./gradlew assembleDebug assembleRelease

      # This step natively zipaligns and signs the APK using Ubuntu's installed Android SDK
      - name: Sign Release APK
        id: sign_app
        run: |
          # 1. Decode the Base64 Keystore
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > my-release-key.jks
          
          # 2. Define Paths
          UNSIGNED_APK="app/build/outputs/apk/release/app-release-unsigned.apk"
          ALIGNED_APK="app/build/outputs/apk/release/app-release-aligned.apk"
          SIGNED_APK="app/build/outputs/apk/release/app-release-signed.apk"
          BUILD_TOOLS="$ANDROID_HOME/build-tools/34.0.0"
          
          # 3. Zipalign the APK
          $BUILD_TOOLS/zipalign -v -p 4 $UNSIGNED_APK $ALIGNED_APK
          
          # 4. Sign the APK
          $BUILD_TOOLS/apksigner sign --ks my-release-key.jks --ks-key-alias "${{ secrets.KEY_ALIAS }}" --ks-pass "pass:${{ secrets.KEYSTORE_PASSWORD }}" --key-pass "pass:${{ secrets.KEY_PASSWORD }}" --out $SIGNED_APK $ALIGNED_APK
          
          # 5. Output the signed file path for the GitHub Release step
          echo "signedReleaseFile=$SIGNED_APK" >> $GITHUB_OUTPUT

      # This creates the GitHub Release and attaches the raw APK files directly
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # Automatically uses the tag name (e.g., v1.0.0) for the release title
          generate_release_notes: true
          files: |
            app/build/outputs/apk/debug/app-debug.apk
            ${{steps.sign_app.outputs.signedReleaseFile}}