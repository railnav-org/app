name: Android Release Build

# This pipeline only runs when you push a version tag (e.g., v1.0, v2.1.3)
on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build, Sign, and Release
    runs-on: ubuntu-latest
    # Required permission to allow the bot to create a GitHub Release
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug and Release APKs
        run: ./gradlew assembleDebug assembleRelease

      # This step takes the unsigned release APK and signs it using your secrets
      - name: Sign Release APK
        uses: r0adkll/sign-android-release@v1
        id: sign_app
        with:
          releaseDirectory: app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.KEYSTORE_BASE64 }}
          alias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}

      # This creates the GitHub Release and attaches the raw APK files directly
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # Automatically uses the tag name (e.g., v1.0.0) for the release title
          generate_release_notes: true
          files: |
            app/build/outputs/apk/debug/app-debug.apk
            ${{steps.sign_app.outputs.signedReleaseFile}}