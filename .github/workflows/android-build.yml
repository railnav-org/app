name: Android CI Build

# 1. When should this pipeline run?
on:
  push:
    branches: [ "central" ]
  pull_request:
    branches: [ "central" ]
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    # 2. What kind of server do we need?
    runs-on: ubuntu-latest

    steps:
      # 3. Download the code onto the server
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 4. Install Java (Android requires this)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle # This speeds up future builds!

      # 5. Make sure the Gradle wrapper can be executed
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 6. Build the Android App
      - name: Build Debug APK
        run: ./gradlew assembleDebug

      # 7. Upload the finished APK so you can download it
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RailNav-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk